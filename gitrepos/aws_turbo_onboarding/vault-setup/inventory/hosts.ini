# ---------------------------------------------------------------------------
# Vault VM Inventory
# ---------------------------------------------------------------------------
# When running Ansible directly on the target Linux VM (local execution):
# Use localhost with ansible_connection=local and set ansible_host to the
# VM's reachable IP/hostname so that generated configs/credentials use the correct address.
# ---------------------------------------------------------------------------

[vault]
localhost ansible_connection=local ansible_host=127.0.0.1

# Remote execution alternative (if running from an external control workstation):
# 192.168.1.50 ansible_user=rhel_admin ansible_ssh_private_key_file=~/.ssh/id_ed25519

[vault:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

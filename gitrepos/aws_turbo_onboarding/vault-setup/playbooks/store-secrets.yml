---
# ---------------------------------------------------------------------------
# store-secrets.yml
# Re-run this playbook any time you rotate or add credentials.
# Does NOT re-initialise or unseal Vault — Vault must already be running.
# ---------------------------------------------------------------------------
- name: Store / rotate credentials in Vault
  hosts: vault
  become: true
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../group_vars/vault.yml"

  tasks:
    - name: Load Vault init data (for root token)
      ansible.builtin.slurp:
        src: "{{ vault_config_dir }}/.vault_init.json"
      register: vault_init_file_content

    - name: Parse init data
      ansible.builtin.set_fact:
        vault_init_data: "{{ vault_init_file_content.content | b64decode | from_json }}"
      no_log: true

    - name: Verify Vault is unsealed before writing secrets
      ansible.builtin.uri:
        url: "https://127.0.0.1:8200/v1/sys/seal-status"
        validate_certs: false
        method: GET
      register: seal_check
      failed_when: seal_check.json.sealed

    - name: Store / update toolkit secrets in Vault
      ansible.builtin.uri:
        url: "https://127.0.0.1:8200/v1/{{ vault_kv_mount_path }}/data/{{ item.key }}"
        validate_certs: false
        method: POST
        headers:
          X-Vault-Token: "{{ vault_init_data.root_token }}"
        body_format: json
        body:
          data: "{{ item.value }}"
        status_code: [200, 204]
      loop: "{{ vault_secrets | dict2items }}"
      no_log: true

    - name: Confirm secrets stored
      ansible.builtin.debug:
        msg: "Updated {{ vault_secrets | length }} secret(s) in Vault at {{ vault_kv_mount_path }}/turbo/"

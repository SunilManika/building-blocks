---
# ---------------------------------------------------------------------------
# Authenticate with root token
# ---------------------------------------------------------------------------

- name: Set root token fact
  ansible.builtin.set_fact:
    vault_root_token: "{{ vault_init_data.root_token }}"
  no_log: true

# ---------------------------------------------------------------------------
# Enable KV v2 secrets engine
# ---------------------------------------------------------------------------

- name: List existing secrets engines
  ansible.builtin.uri:
    url: "https://127.0.0.1:8200/v1/sys/mounts"
    validate_certs: false
    method: GET
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    status_code: 200
  register: vault_mounts
  no_log: true

- name: "Enable KV v2 secrets engine at {{ vault_kv_mount_path }}/"
  ansible.builtin.uri:
    url: "https://127.0.0.1:8200/v1/sys/mounts/{{ vault_kv_mount_path }}"
    validate_certs: false
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      type: kv
      options:
        version: "{{ vault_kv_version | string }}"
    status_code: [200, 204]
  when: (vault_kv_mount_path + '/') not in vault_mounts.json
  no_log: true

# ---------------------------------------------------------------------------
# Create Vault policy for the toolkit AppRole
# ---------------------------------------------------------------------------

- name: Write turbo-toolkit Vault policy
  ansible.builtin.uri:
    url: "https://127.0.0.1:8200/v1/sys/policies/acl/turbo-toolkit"
    validate_certs: false
    method: PUT
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      policy: |
        # Allow the turbo-toolkit AppRole to read all secrets under secret/turbo/
        path "{{ vault_kv_mount_path }}/data/turbo/*" {
          capabilities = ["read"]
        }
        path "{{ vault_kv_mount_path }}/metadata/turbo/*" {
          capabilities = ["list", "read"]
        }
    status_code: [200, 204]
  no_log: true

# ---------------------------------------------------------------------------
# Enable AppRole auth and create turbo-toolkit role
# ---------------------------------------------------------------------------

- name: List enabled auth methods
  ansible.builtin.uri:
    url: "https://127.0.0.1:8200/v1/sys/auth"
    validate_certs: false
    method: GET
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    status_code: 200
  register: vault_auth_methods
  no_log: true

- name: Enable AppRole auth method
  ansible.builtin.uri:
    url: "https://127.0.0.1:8200/v1/sys/auth/approle"
    validate_certs: false
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      type: approle
    status_code: [200, 204]
  when: "'approle/' not in vault_auth_methods.json"
  no_log: true

- name: "Create {{ vault_approle_name }} AppRole"
  ansible.builtin.uri:
    url: "https://127.0.0.1:8200/v1/auth/approle/role/{{ vault_approle_name }}"
    validate_certs: false
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      token_policies: ["turbo-toolkit"]
      token_ttl: "{{ vault_approle_token_ttl }}"
      token_max_ttl: "{{ vault_approle_token_max_ttl }}"
      secret_id_ttl: "{{ vault_approle_secret_id_ttl }}"
      bind_secret_id: true
    status_code: [200, 204]
  no_log: true

# ---------------------------------------------------------------------------
# Retrieve AppRole credentials and save to Ansible control node
# ---------------------------------------------------------------------------

- name: Get AppRole role_id
  ansible.builtin.uri:
    url: "https://127.0.0.1:8200/v1/auth/approle/role/{{ vault_approle_name }}/role-id"
    validate_certs: false
    method: GET
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    status_code: 200
  register: vault_role_id_response
  no_log: true

- name: Generate AppRole secret_id
  ansible.builtin.uri:
    url: "https://127.0.0.1:8200/v1/auth/approle/role/{{ vault_approle_name }}/secret-id"
    validate_certs: false
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body: {}
    status_code: 200
  register: vault_secret_id_response
  no_log: true

- name: Ensure local output directory exists on control node
  ansible.builtin.file:
    path: "{{ vault_local_output_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: true

- name: Save AppRole credentials to control node (output/approle-credentials.json)
  ansible.builtin.copy:
    content: |
      {
        "vault_addr":  "https://{{ ansible_host }}:8200",
        "role_id":     "{{ vault_role_id_response.json.data.role_id }}",
        "secret_id":   "{{ vault_secret_id_response.json.data.secret_id }}"
      }
    dest: "{{ vault_local_output_dir }}/approle-credentials.json"
    mode: "0644"
  delegate_to: localhost
  become: true
  no_log: true

# ---------------------------------------------------------------------------
# Store all toolkit credentials in Vault KV v2
# ---------------------------------------------------------------------------

- name: Store toolkit secrets in Vault
  ansible.builtin.uri:
    url: "https://127.0.0.1:8200/v1/{{ vault_kv_mount_path }}/data/{{ item.key }}"
    validate_certs: false
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      data: "{{ item.value }}"
    status_code: [200, 204]
  loop: "{{ vault_secrets | dict2items }}"
  no_log: true

- name: Confirm all secrets stored
  ansible.builtin.debug:
    msg: "Stored {{ vault_secrets | length }} secret(s) under {{ vault_kv_mount_path }}/turbo/"

---
# Role defaults — overridden by group_vars/vault.yml
vault_version: "1.17.2"
vault_download_url: "https://releases.hashicorp.com/vault/{{ vault_version }}/vault_{{ vault_version }}_linux_amd64.zip"
vault_install_dir: /usr/local/bin
vault_config_dir: /etc/vault.d
vault_data_dir: /opt/vault/data
vault_log_dir: /var/log/vault
vault_user: vault
vault_group: vault
vault_listen_address: "0.0.0.0:8200"
vault_cluster_address: "0.0.0.0:8201"
vault_tls_dir: /etc/vault.d/tls
vault_raft_node_id: "vault-node-01"
vault_auto_unseal_type: file
vault_unseal_keys_file: /etc/vault.d/.unseal_keys
vault_init_key_shares: 5
vault_init_key_threshold: 3
vault_init_output_file: /etc/vault.d/.vault_init.json
vault_kv_mount_path: secret
vault_kv_version: 2
vault_approle_name: turbo-toolkit
vault_approle_token_ttl: "1h"
vault_approle_token_max_ttl: "4h"
vault_approle_secret_id_ttl: "0"
